---
# Akash SDL template for the CURE run.
# deploy_cure.py renders the GPU model, max price, GitHub token, and the env block
# at submit time only; the rendered copy with secrets is never written to disk.
# Image pins Ubuntu 24.04 + CUDA 12.6 -> Python 3.12, which matches the precompiled
# flash-attention wheel (cp312 / torch2.5 / cu12). This is fixed by the image, so it
# holds on any provider before bidding.
version: "2.0"

services:
  cure:
    image: nvidia/cuda:12.6.2-cudnn-devel-ubuntu24.04
    command:
      - bash
      - -c
      - >
        apt-get update -y &&
        apt-get install -y --no-install-recommends git ca-certificates &&
        rm -rf /workspace/Cure_Audit_Benchmark &&
        git clone https://__GH_TOKEN__@github.com/DevDaring/Cure_Audit_Benchmark /workspace/Cure_Audit_Benchmark &&
        cd /workspace/Cure_Audit_Benchmark/Code/CURE &&
        bash bootstrap.sh 2>&1 | tee /workspace/boot.log
    env:
__ENV_BLOCK__
    expose:
      - port: 8080
        as: 80
        to:
          - global: true

profiles:
  compute:
    cure:
      resources:
        cpu:
          units: 8
        memory:
          size: 48Gi
        storage:
          - size: 140Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                - model: __GPU_MODEL__
  placement:
    dcloud:
      pricing:
        cure:
          denom: uakt
          amount: __MAX_PRICE__

deployment:
  cure:
    dcloud:
      profile: cure
      count: 1
